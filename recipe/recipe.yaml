schema_version: 1

context:
  version: "5.0.0"

package:
  name: libwebsockets
  version: ${{ version }}

source:
  url: https://github.com/warmcat/libwebsockets/archive/refs/tags/v${{ version }}.tar.gz
  sha256: f853c6582101cfcee3a5a9e28ae92ab19d9735c5f31f0bb2e9794b5106123962
  patches:
    - if: win
      then:
        - patches/001-msvc-no-warnings-as-errors.patch
    - if: linux
      then:
        - patches/002-use-linux-in6-h-instead-of-linux-ipv6-h.patch

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
    - pkg-config
  host:
    - libuv
    - openssl
  run_exports:
    - ${{ pin_subpackage('libwebsockets', upper_bound='x.x') }}

tests:
  - package_contents:
      include:
        - libwebsockets.h
        - libwebsockets/lws-context-vhost.h
      lib:
        - websockets
  # builds a small program against the exported cmake config, which has a history
  # of pointing at build-time-only locations of openssl
  - script:
      - if: unix
        then:
          - cmake -GNinja -S consumer_test -B consumer_test/build ${CMAKE_ARGS} -DCMAKE_BUILD_TYPE=Release
          - cmake --build consumer_test/build
          - ./consumer_test/build/lws_version
        else:
          - cmake -GNinja -S consumer_test -B consumer_test/build %CMAKE_ARGS% -DCMAKE_BUILD_TYPE=Release
          - cmake --build consumer_test/build
          - consumer_test\build\lws_version.exe
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - cmake
        - ninja
    files:
      recipe:
        - consumer_test/

about:
  homepage: https://libwebsockets.org
  license: MIT
  license_file: LICENSE
  summary: canonical libwebsockets.org websocket library
  description: |
    Libwebsockets is a simple-to-use, pure C library providing client and server
    for **http/1**, **http/2**, **websockets** and other protocols in a security-minded,
    lightweight, configurable, scalable and flexible way.  It's easy to build and
    cross-build via cmake and is suitable for tasks from embedded RTOS through mass
    cloud serving.
  repository: https://github.com/warmcat/libwebsockets
  documentation: https://libwebsockets.org/lws-api-doc-master/html/index.html

extra:
  recipe-maintainers:
    - sodre
    - wolfv
    - pavelzw
